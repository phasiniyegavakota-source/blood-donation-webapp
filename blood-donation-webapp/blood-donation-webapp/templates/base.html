<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LifeDrop Blood Donation{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('main.home') }}">&#128138; LifeDrop</a>
      <nav>
        <a href="{{ url_for('main.home') }}">Home</a>
        <a href="{{ url_for('main.register') }}">Register</a>
        <a href="{{ url_for('main.search') }}">Search</a>
        <a href="{{ url_for('main.request_blood') }}">Request Blood</a>
        <a href="{{ url_for('main.donors') }}">Donors</a>
        <a href="{{ url_for('main.inventory') }}">Inventory</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>LifeDrop &mdash; a student portfolio project demonstrating a blood donation management system built with Flask &amp; SQLAlchemy. Not affiliated with any real blood bank.</p>
    </div>
  </footer>
</body>
</html>
